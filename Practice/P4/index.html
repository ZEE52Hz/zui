<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: flex;
        margin: auto;
      }
      body {
        background-color: hsl(0, 0%, 8%);
        color: hsl(0, 0%, 100%);
        font-family: "inter", sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: max-content;
        width: max-content;
        justify-content: center;
        margin: 20% auto;
        background-color: hsl(0, 0%, 12%);
        border-radius: 12px;
        padding: 2rem;
      }
      #location {
        color: hsl(75, 94%, 57%);
        display: flex;
        justify-content: center;
      }
#social-links {
  display: flex;
  flex-direction: column;
    gap: 1rem;
    
}
button {
    background-color: hsl(0, 0%, 20%);
    border: none;
    color: hsl(0, 0%, 100%);
    font-size: 15px;
    border-radius: 5px;
    padding: 0.5rem 6rem;
}
#profile {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
h1 {
    margin: 0;
}
    </style>
  </head>
  <body>
    <div class="container">
      <div id="profile">
        <img src="./img/avatar-jessica (3).jpeg" alt="Jessica" />
        <div><h1>Jessica Randall</h1>
        <p id="location">London, United Kingdom</p>
        </div>
      </div>
      <p id="bio">"Front-end Developer and avid reader."</p>
      <div id="social-links">
        <button>GitHub</button><button>Frontend Mentor</button><button>LinkedIn</button><button>Twitter</button
        ><button>Instagram</button>
      </div>
    </div>
  </body>
</html>
