<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Favorite Places</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>My Favorite Places</h1>
    <p class="intro">A simple page made with CSS Grid.</p>

    <div class="places">
      <div class="card">
        <h2>Beach</h2>
        <p>Warm sand and quiet waves.</p>
      </div>

      <div class="card">
        <h2>Mountains</h2>
        <p>Fresh air and big views.</p>
      </div>

      <div class="card">
        <h2>City</h2>
        <p>Lights, food, and people.</p>
      </div>

      <div class="card">
        <h2>Forest</h2>
        <p>Trees, birds, and calm walks.</p>
      </div>

      <div class="card">
        <h2>Cafe</h2>
        <p>Coffee and a good book.</p>
      </div>

      <div class="card">
        <h2>Library</h2>
        <p>Quiet rooms full of stories.</p>
      </div>
    </div>
  </body>
</html>
